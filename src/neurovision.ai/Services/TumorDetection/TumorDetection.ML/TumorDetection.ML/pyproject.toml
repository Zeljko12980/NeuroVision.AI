[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tumor-detection-ml"
version = "1.0.0"
description = "YOLO11 training and inference for NeuroVision brain tumor detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0",
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "huggingface_hub>=0.26.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.0.0",
  "numpy>=1.26.0",
  "pyyaml>=6.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
